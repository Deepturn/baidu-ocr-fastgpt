name: baidu-ocr-fastgpt

services:
  baidu-ocr-adapter:
    image: fastgpt/baidu-ocr-adapter:0.1.0
    platform: linux/amd64
    pull_policy: never
    container_name: fastgpt-baidu-ocr-adapter
    init: true
    restart: unless-stopped
    ports:
      - "${OCR_BIND_ADDRESS:-127.0.0.1}:${OCR_HOST_PORT:-7231}:8000"
    environment:
      BAIDU_OCR_URL: "${BAIDU_OCR_URL:-https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic}"
      BAIDU_AUTH_URL: "${BAIDU_AUTH_URL:-https://aip.baidubce.com/oauth/2.0/token}"
      BAIDU_API_KEY: "${BAIDU_API_KEY:-replace-with-baidu-api-key}"
      BAIDU_SECRET_KEY: "${BAIDU_SECRET_KEY:-replace-with-baidu-secret-key}"
      FASTGPT_OCR_TOKEN: "${FASTGPT_OCR_TOKEN:-replace-with-independent-random-token}"
      OCR_MAX_FILE_MB: "${OCR_MAX_FILE_MB:-20}"
      OCR_MAX_PAGES: "${OCR_MAX_PAGES:-100}"
      OCR_MAX_CONCURRENT_FILES: "${OCR_MAX_CONCURRENT_FILES:-2}"
      OCR_MAX_CONCURRENT_OCR: "${OCR_MAX_CONCURRENT_OCR:-1}"
      OCR_REQUESTS_PER_SECOND: "${OCR_REQUESTS_PER_SECOND:-1}"
      OCR_TOTAL_TIMEOUT_SECONDS: "${OCR_TOTAL_TIMEOUT_SECONDS:-540}"
      OCR_UPSTREAM_TIMEOUT_SECONDS: "${OCR_UPSTREAM_TIMEOUT_SECONDS:-60}"
      OCR_ALLOW_INSECURE_HTTP: "false"
      OCR_MAX_SOURCE_PIXELS: "${OCR_MAX_SOURCE_PIXELS:-40000000}"
      OCR_MAX_RENDER_PIXELS: "${OCR_MAX_RENDER_PIXELS:-16000000}"
      OCR_RENDER_DPI: "${OCR_RENDER_DPI:-200}"
      OCR_MULTIPART_OVERHEAD_BYTES: "${OCR_MULTIPART_OVERHEAD_BYTES:-1048576}"
      OCR_MAX_OUTPUT_CHARS: "${OCR_MAX_OUTPUT_CHARS:-2000000}"
      OCR_MAX_UPSTREAM_RESPONSE_BYTES: "${OCR_MAX_UPSTREAM_RESPONSE_BYTES:-8388608}"
      OCR_WORKER_MEMORY_MB: "${OCR_WORKER_MEMORY_MB:-512}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1073741824
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
